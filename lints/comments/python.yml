id: no-new-comments-python
language: Python
severity: error
message: "Comment added: say it with a name, a type or a test (kept: doc comments, tool directives, license, Given/When/Then)"
rule:
  kind: comment
  not:
    any:
      - regex: '^(#!|#\s*(-\*-|noqa|nosec|type:|pragma|pylint:|fmt:|mypy:|ruff:|isort:|pyright:|(Given|When|Then|And)\b)|.*(?i:copyright|spdx-license-identifier))'
      - inside:
          stopBy: end
          has:
            kind: comment
            regex: 'Code generated .*DO NOT EDIT|@generated'
