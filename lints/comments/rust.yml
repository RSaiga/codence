id: no-new-comments-rust
language: Rust
severity: error
message: "Comment added: say it with a name, a type or a test (kept: doc comments, tool directives, license, Given/When/Then)"
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  not:
    any:
      - regex: '^(///|//!|/\*\*|/\*!|//\s*(SAFETY:|(Given|When|Then|And)\b)|.*(?i:copyright|spdx-license-identifier))'
      - inside:
          stopBy: end
          has:
            any:
              - kind: line_comment
              - kind: block_comment
            regex: 'Code generated .*DO NOT EDIT|@generated'
